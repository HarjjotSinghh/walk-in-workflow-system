# Nginx configuration for wiws.verbflo.com
# This is the initial HTTP-only version. After running certbot, it will be updated with SSL.

# HTTP Server - Redirect to HTTPS (after SSL is set up)
# For now, this serves the application over HTTP
server {
    listen 80;
    listen [::]:80;
    server_name wiws.verbflo.com www.wiws.verbflo.com;

    # For Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Serve the application over HTTP (temporary, until SSL is configured)
    # After running certbot, this will be updated to redirect to HTTPS
    
    # Logging
    access_log /var/log/nginx/wiws-access.log;
    error_log /var/log/nginx/wiws-error.log;

    # Client body size limit (adjust as needed)
    client_max_body_size 10M;

    # API Proxy Configuration
    location /api {
        proxy_pass http://localhost:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket/SSE Support for streaming
    location /api/stream {
        proxy_pass http://localhost:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Frontend Application
    location / {
        proxy_pass http://localhost:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://localhost:4173;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, immutable";
            expires 30d;
        }
    }

    # Health check endpoint (optional, for monitoring)
    location /health {
        proxy_pass http://localhost:8787/health;
        access_log off;
    }
}

# HTTPS Server Configuration (will be added by certbot)
# After running: sudo certbot --nginx -d wiws.verbflo.com -d www.wiws.verbflo.com
# Certbot will automatically update this file to include SSL configuration

